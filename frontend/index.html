<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aaditya Kumar | Full-Stack Developer Portfolio</title>
    <meta name="description" content="Portfolio of Aaditya Kumar — a full-stack developer specialising in React, Node.js, and modern web technologies. View projects, skills, and experience." />
    <meta name="author" content="Aaditya Kumar" />
    <meta name="theme-color" content="#06060B" />
    <meta property="og:title" content="Aaditya Kumar | Full-Stack Developer" />
    <meta property="og:description" content="Full-stack developer crafting digital experiences with React, Node.js, and modern web tech." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/Aaditya.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      #initial-splash {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
        align-items: center; justify-content: center; overflow: hidden;
        background: #080910; color: #f8fafc; opacity: 1;
        transition: opacity 300ms cubic-bezier(.2,.75,.25,1), visibility 300ms;
      }
      #initial-splash.is-leaving { opacity: 0; visibility: hidden; pointer-events: none; }
      .initial-splash__name { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 .035em; padding: 0 1rem; font: 800 clamp(2.3rem, 8vw, 5.8rem)/1.1 system-ui, sans-serif; letter-spacing: -.055em; }
      .initial-splash__name span:not(.initial-splash__space) { opacity: 0; filter: blur(8px); transform: translateY(22px); animation: splash-letter-in 420ms cubic-bezier(.22,1,.36,1) forwards; }
      .initial-splash__name span:nth-child(1) { animation-delay: 40ms; }
      .initial-splash__name span:nth-child(2) { animation-delay: 60ms; }
      .initial-splash__name span:nth-child(3) { animation-delay: 80ms; }
      .initial-splash__name span:nth-child(4) { animation-delay: 100ms; }
      .initial-splash__name span:nth-child(5) { animation-delay: 120ms; }
      .initial-splash__name span:nth-child(6) { animation-delay: 140ms; }
      .initial-splash__name span:nth-child(7) { animation-delay: 160ms; }
      .initial-splash__name span:nth-child(9) { animation-delay: 200ms; }
      .initial-splash__name span:nth-child(10) { animation-delay: 220ms; }
      .initial-splash__name span:nth-child(11) { animation-delay: 240ms; }
      .initial-splash__name span:nth-child(12) { animation-delay: 260ms; }
      .initial-splash__name span:nth-child(13) { animation-delay: 280ms; }
      .initial-splash__space { width: .22em; }
      .initial-splash__role { margin: 1.1rem 0 0; color: #a5b4c8; font: 300 clamp(.95rem, 2vw, 1.25rem)/1.5 Inter, sans-serif; letter-spacing: .14em; opacity: 0; animation: splash-fade-in 400ms ease 250ms forwards; }
      .initial-splash__line { width: 84px; height: 2px; margin-top: 2rem; border-radius: 999px; background: linear-gradient(90deg,#22d3ee,#8b5cf6); transform: scaleX(0); transform-origin: left; animation: splash-line-in 500ms ease 280ms forwards; }
      .initial-splash__skip { position: absolute; right: 1.5rem; bottom: 1.5rem; border: 1px solid rgba(34,211,238,.35); border-radius: 999px; padding: .65rem 1rem; background: rgba(12,13,20,.7); color: #a5f3fc; font: 500 .8rem/1.2 Inter, sans-serif; cursor: pointer; transition: background-color 200ms ease, border-color 200ms ease; }
      .initial-splash__skip:hover { background: rgba(6,182,212,.12); border-color: rgba(34,211,238,.7); }
      .initial-splash__skip:focus-visible { outline: 2px solid #22d3ee; outline-offset: 3px; }
      @keyframes splash-letter-in { to { opacity: 1; filter: blur(0); transform: translateY(0); } }
      @keyframes splash-fade-in { to { opacity: 1; } }
      @keyframes splash-line-in { to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) {
        #initial-splash { transition-duration: 1ms; }
        .initial-splash__name span:not(.initial-splash__space), .initial-splash__role, .initial-splash__line { animation-duration: 1ms; animation-delay: 0ms; }
      }
    </style>
  </head>
  <body>
    <div id="initial-splash" role="status" aria-label="Loading Aaditya Kumar portfolio">
      <div class="initial-splash__name" aria-label="Aaditya Kumar">
        <span>A</span><span>A</span><span>D</span><span>I</span><span>T</span><span>Y</span><span>A</span><span class="initial-splash__space"></span><span>K</span><span>U</span><span>M</span><span>A</span><span>R</span>
      </div>
      <p class="initial-splash__role">Full-Stack Developer</p>
      <span class="initial-splash__line" aria-hidden="true"></span>
      <button type="button" class="initial-splash__skip" data-splash-skip aria-label="Skip introduction">Skip introduction</button>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
